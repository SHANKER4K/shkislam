<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Tajawal, Noto Sans Arabic, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5F4EF"/>
      <stop offset="0.25" stop-color="#F5F4EF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect width="1600" height="900" fill="#F5F4EF"/>

  <!-- content column (RTL: sidebar right) -->
  <!-- sidebar -->
  <rect x="1260" y="0" width="340" height="900" fill="#FCFBF8"/>
  <line x1="1260" y1="0" x2="1260" y2="900" stroke="#DAD8CE" stroke-width="1"/>

  <!-- sidebar wordmark -->
  <text x="1530" y="52" font-size="20" font-weight="800" fill="#2B2A24" text-anchor="end">SHK Islam</text>

  <!-- new chat ghost plate -->
  <rect x="1288" y="74" width="284" height="38" rx="6" fill="none" stroke="#DAD8CE" stroke-width="1"/>
  <text x="1304" y="98" font-size="14" font-weight="500" fill="#7A786E">+  محادثة جديدة</text>

  <!-- hairline -->
  <line x1="1288" y1="136" x2="1572" y2="136" stroke="#DAD8CE" stroke-width="1"/>

  <!-- nav index -->
  <text x="1572" y="166" font-size="12" font-weight="500" fill="#7A786E" text-anchor="end" letter-spacing="2">الفهرس</text>

  <!-- active item -->
  <rect x="1288" y="186" width="284" height="34" rx="4" fill="#E4E3D8"/>
  <rect x="1260" y="190" width="3" height="26" fill="#4C5B3C"/>
  <text x="1304" y="209" font-size="15" font-weight="700" fill="#2B2A24">القرآن الكريم</text>

  <rect x="1288" y="226" width="284" height="34" rx="4" fill="none"/>
  <text x="1304" y="249" font-size="15" font-weight="500" fill="#7A786E">الأحاديث النبوية</text>

  <rect x="1288" y="266" width="284" height="34" rx="4" fill="none"/>
  <text x="1304" y="289" font-size="15" font-weight="500" fill="#7A786E">المواضيع</text>

  <rect x="1288" y="306" width="284" height="34" rx="4" fill="none"/>
  <text x="1304" y="329" font-size="15" font-weight="500" fill="#7A786E">المفضلة</text>

  <rect x="1288" y="346" width="284" height="34" rx="4" fill="none"/>
  <text x="1304" y="369" font-size="15" font-weight="500" fill="#7A786E">البحث</text>

  <!-- hairline -->
  <line x1="1288" y1="400" x2="1572" y2="400" stroke="#DAD8CE" stroke-width="1"/>

  <!-- footer cluster -->
  <rect x="1288" y="420" width="284" height="34" rx="4" fill="none"/>
  <text x="1304" y="443" font-size="15" font-weight="500" fill="#7A786E">نبذة عن الموقع</text>
  <rect x="1288" y="838" width="120" height="34" rx="4" fill="none"/>
  <circle cx="1304" cy="856" r="8" fill="none" stroke="#7A786E" stroke-width="1.5"/>
  <rect x="1318" y="849" width="10" height="4" rx="2" fill="#7A786E"/>
  <text x="1340" y="860" font-size="13" font-weight="500" fill="#7A786E">الوضع الليلي</text>

  <!-- chat column -->
  <!-- accent rule -->
  <rect x="750" y="70" width="24" height="3" fill="#4C5B3C"/>

  <!-- headline -->
  <text x="762" y="130" font-size="36" font-weight="800" fill="#2B2A24">مرحباً بك في مكتبتك الإسلامية</text>
  <text x="762" y="172" font-size="17" font-weight="400" fill="#7A786E">اسأل عن أي آية أو حديث، وستجده مؤطّراً أمامك</text>

  <!-- suggestion plates staggered -->
  <rect x="470" y="210" width="292" height="44" rx="6" fill="none" stroke="#DAD8CE" stroke-width="1"/>
  <text x="490" y="237" font-size="15" font-weight="500" fill="#2B2A24">آيات عن الصبر في الشدائد</text>

  <rect x="782" y="210" width="292" height="44" rx="6" fill="none" stroke="#DAD8CE" stroke-width="1"/>
  <text x="802" y="237" font-size="15" font-weight="500" fill="#2B2A24">أحاديث عن برّ الوالدين</text>

  <rect x="470" y="274" width="292" height="44" rx="6" fill="none" stroke="#DAD8CE" stroke-width="1"/>
  <text x="490" y="301" font-size="15" font-weight="500" fill="#2B2A24">فضل صيام عاشوراء</text>

  <rect x="782" y="286" width="292" height="44" rx="6" fill="none" stroke="#DAD8CE" stroke-width="1"/>
  <text x="802" y="313" font-size="15" font-weight="500" fill="#2B2A24">تفسير سورة الفاتحة</text>

  <!-- user message (note card) -->
  <rect x="962" y="380" width="330" height="48" rx="6" fill="#E4E3D8"/>
  <text x="982" y="409" font-size="16" font-weight="500" fill="#2B2A24">ما هي الآيات التي تتحدث عن التوكل؟</text>

  <!-- assistant prose -->
  <text x="420" y="500" font-size="17" font-weight="400" fill="#2B2A24">من آيات التوكل في القرآن الكريم، قوله تعالى:</text>

  <!-- framed ayah plate -->
  <rect x="420" y="530" width="600" height="150" rx="6" fill="#FCFBF8" stroke="#DAD8CE" stroke-width="1"/>
  <rect x="420" y="534" width="3" height="142" fill="#4C5B3C"/>
  <text x="1000" y="590" font-size="26" font-weight="700" fill="#2B2A24" text-anchor="end" font-family="KFGQPC Uthmanic HAFS, Noto Naskh Arabic, serif">وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ</text>
  <text x="1000" y="630" font-size="26" font-weight="700" fill="#2B2A24" text-anchor="end" font-family="KFGQPC Uthmanic HAFS, Noto Naskh Arabic, serif">۝ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ</text>
  <text x="440" y="662" font-size="12" font-weight="500" fill="#7A786E" letter-spacing="1">سورة الطلاق · 65:3</text>

  <!-- assistant continuation -->
  <text x="420" y="730" font-size="17" font-weight="400" fill="#2B2A24">وهذا من أعظم ما يعين العبد على تفريج الكرب.</text>

  <!-- docked input plate -->
  <rect x="420" y="772" width="600" height="52" rx="6" fill="#FCFBF8" stroke="#DAD8CE" stroke-width="1"/>
  <text x="440" y="804" font-size="16" font-weight="400" fill="#A8A69B">اكتب سؤالك هنا...</text>
  <rect x="958" y="784" width="40" height="28" rx="4" fill="#4C5B3C"/>
  <path d="M 976 792 l -8 6 l 8 6 z" fill="#FCFBF8"/>
</svg>
