<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Tajawal, Inter, sans-serif">
  <!-- ground: ivory -->
  <rect width="1280" height="720" fill="#f4efe4"/>
  <!-- faint star lattice texture on chat column -->
  <defs>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 20 L37 27 L44 32 L37 37 L32 44 L27 37 L20 32 L27 27 Z" fill="none" stroke="#0f4c4c" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="stars-dark" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 14 L28 20 L34 24 L28 28 L24 34 L20 28 L14 24 L20 20 Z" fill="none" stroke="#f4efe4" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="400" y="0" width="880" height="720" fill="url(#stars)"/>

  <!-- sidebar: deep teal tile wall (RTL start = right) -->
  <rect x="880" y="0" width="400" height="720" fill="#0d3b3b"/>
  <rect x="880" y="0" width="400" height="720" fill="url(#stars-dark)"/>
  <rect x="880" y="0" width="2" height="720" fill="#c9a227"/>

  <!-- logo row -->
  <g transform="translate(960, 36)">
    <path d="M0 0 L8 0 L4 6 Z M0 0 L0 8 L6 4 Z" fill="#c9a227"/>
  </g>
  <text x="1000" y="42" fill="#f4efe4" font-size="20" font-weight="800">SHK Islam</text>

  <!-- new chat -->
  <rect x="900" y="70" width="360" height="44" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="924" y="98" fill="#c9a227" font-size="16" font-weight="600">+  محادثة جديدة</text>

  <!-- nav items -->
  <g font-size="16" font-weight="600">
    <rect x="900" y="140" width="360" height="40" fill="#0a2e2e"/>
    <path d="M920 156 L925 162 L932 166 L925 170 L920 176 L915 170 L908 166 L915 162 Z" fill="#c9a227"/>
    <text x="944" y="166" fill="#f4efe4">القرآن الكريم</text>

    <rect x="900" y="188" width="360" height="40" fill="#0d3b3b"/>
    <path d="M920 204 L924 209 L930 212 L924 215 L920 220 L916 215 L910 212 L916 209 Z" fill="none" stroke="#f4efe4" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="944" y="214" fill="#f4efe4" fill-opacity="0.85">الأحاديث النبوية</text>

    <rect x="900" y="236" width="360" height="40" fill="#0d3b3b"/>
    <path d="M920 252 L924 257 L930 260 L924 263 L920 268 L916 263 L910 260 L916 257 Z" fill="none" stroke="#f4efe4" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="944" y="262" fill="#f4efe4" fill-opacity="0.85">المواضيع</text>

    <rect x="900" y="284" width="360" height="40" fill="#0d3b3b"/>
    <path d="M920 300 L924 305 L930 308 L924 311 L920 316 L916 311 L910 308 L916 305 Z" fill="none" stroke="#f4efe4" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="944" y="310" fill="#f4efe4" fill-opacity="0.85">المفضلة</text>

    <rect x="900" y="332" width="360" height="40" fill="#0d3b3b"/>
    <path d="M920 348 L924 353 L930 356 L924 359 L920 364 L916 359 L910 356 L916 353 Z" fill="none" stroke="#f4efe4" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="944" y="358" fill="#f4efe4" fill-opacity="0.85">البحث</text>
  </g>

  <!-- chat column -->
  <text x="64" y="80" font-size="15" font-weight="600" fill="#0f4c4c">أحاديث عن الصبر</text>
  <g transform="translate(64, 96)">
    <rect width="760" height="1.2" fill="#c9a227" fill-opacity="0.45"/>
    <path d="M0 -6 L4 -1 L10 2 L4 5 L0 10 L-4 5 L-10 2 L-4 -1 Z" fill="#c9a227"/>
  </g>

  <!-- user tile -->
  <rect x="584" y="116" width="240" height="64" fill="#0d3b3b"/>
  <text x="604" y="156" fill="#f4efe4" font-size="17" font-weight="600">ما الأحاديث عن الصبر؟</text>

  <!-- tool callout: streaming, seam star outline -->
  <rect x="64" y="200" width="640" height="120" fill="#efe9d8" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M80 214 L84 219 L90 222 L84 225 L80 230 L76 225 L70 222 L76 219 Z" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <text x="96" y="226" font-size="13" font-weight="600" fill="#8a6d1f">جاري جلب البيانات من قاعدة الأحاديث</text>
  <text x="96" y="260" font-family="'KFGQPC-Uthmanic-HAFS', serif" font-size="24" fill="#1d3a3a">جاري تحميل نص الحديث...</text>

  <!-- assistant message -->
  <path d="M64 356 L68 361 L74 364 L68 367 L64 372 L60 367 L54 364 L60 361 Z" fill="#c9a227"/>
  <text x="84" y="356" font-size="18" fill="#1d3a3a" font-weight="400">من الأحاديث الجامعة في باب الصبر قول النبي ﷺ:</text>

  <!-- settled callout with Uthmanic quote + gold source -->
  <rect x="64" y="380" width="680" height="130" fill="#efe9d8" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M80 394 L84 399 L90 402 L84 405 L80 410 L76 405 L70 402 L76 399 Z" fill="#c9a227"/>
  <text x="96" y="434" font-family="'KFGQPC-Uthmanic-HAFS', serif" font-size="30" fill="#1d3a3a">"العَجَبُ لأمرِ المؤمنِ إنَّ أمرَهُ كلَّهُ خيرٌ..."</text>
  <text x="96" y="470" font-size="13" font-weight="600" fill="#8a6d1f">رواه مسلم - صحيح مسلم ٢٩٩٩</text>

  <!-- docked input -->
  <rect x="64" y="560" width="780" height="64" fill="#f4efe4" stroke="#0f4c4c" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="92" y="598" font-size="17" fill="#0f4c4c" fill-opacity="0.5">اكتب سؤالك هنا...</text>
  <!-- star send button -->
  <g transform="translate(804, 572)">
    <rect width="40" height="40" fill="#0d3b3b"/>
    <path d="M20 8 L24 15 L31 20 L24 25 L20 32 L16 25 L9 20 L16 15 Z" fill="#c9a227"/>
  </g>

  <!-- footer strip: brand mark -->
  <text x="64" y="676" font-size="12" fill="#0f4c4c" fill-opacity="0.5">SHK Islam · منصة إسلامية للدعاة والخطباء</text>
</svg>
