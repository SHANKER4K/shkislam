<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0c0f22"/>
    </radialGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c063" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f2c063" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- star field -->
  <circle cx="120" cy="120" r="1.5" fill="#dfe8ff" opacity="0.7"/>
  <circle cx="340" cy="80" r="1" fill="#dfe8ff" opacity="0.5"/>
  <circle cx="600" cy="150" r="1.2" fill="#dfe8ff" opacity="0.6"/>
  <circle cx="850" cy="95" r="1" fill="#dfe8ff" opacity="0.4"/>
  <circle cx="1050" cy="180" r="1.5" fill="#dfe8ff" opacity="0.6"/>
  <circle cx="1280" cy="110" r="1" fill="#dfe8ff" opacity="0.5"/>
  <circle cx="1480" cy="160" r="1.3" fill="#dfe8ff" opacity="0.7"/>
  <circle cx="220" cy="260" r="1" fill="#dfe8ff" opacity="0.4"/>
  <circle cx="720" cy="40" r="1.2" fill="#dfe8ff" opacity="0.5"/>
  <circle cx="1120" cy="60" r="1" fill="#dfe8ff" opacity="0.4"/>

  <!-- crescent mark -->
  <g transform="translate(150,120)">
    <circle cx="0" cy="0" r="26" fill="#f2c063" opacity="0.9"/>
    <circle cx="10" cy="-6" r="24" fill="#141a33"/>
  </g>

  <!-- sidebar (right) -->
  <rect x="1280" y="0" width="320" height="900" fill="#111426" opacity="0.9"/>
  <path d="M1280 0 L1282 900" stroke="#222740" stroke-width="1" fill="none"/>

  <!-- sidebar items -->
  <rect x="1300" y="180" width="280" height="44" rx="10" fill="#1a2138"/>
  <rect x="1300" y="240" width="280" height="44" rx="10" fill="#1b2340"/>
  <rect x="1300" y="300" width="280" height="44" rx="10" fill="#1b2340"/>
  <rect x="1300" y="360" width="280" height="44" rx="10" fill="#1b2340"/>
  <rect x="1300" y="420" width="280" height="44" rx="10" fill="#222740"/>

  <text x="1320" y="208" fill="#c9d2ee" font-size="18">القرآن الكريم</text>
  <text x="1320" y="268" fill="#8f9ac4" font-size="18">الأحاديث النبوية</text>
  <text x="1320" y="328" fill="#8f9ac4" font-size="18">المواضيع</text>
  <text x="1320" y="388" fill="#8f9ac4" font-size="18">المفضلة</text>
  <text x="1320" y="448" fill="#c9d2ee" font-size="18">المحادثة الجديدة</text>

  <!-- chat column -->
  <rect x="200" y="160" width="820" height="120" rx="16" fill="#161b33" stroke="#f2c063" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="240" y="210" fill="#e8dcc8" font-size="24">السلام عليكم، كيف يمكنني مساعدتك؟</text>
  <text x="240" y="248" fill="#9aa3c9" font-size="17">اسأل عن أي آية أو حديث أو مسألة شرعية</text>

  <!-- ayah callout -->
  <rect x="170" y="560" width="880" height="170" rx="16" fill="#141a2e" stroke="#f2c063" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="210" y="610" fill="#f2c063" font-size="15" opacity="0.9">آية كريمة</text>
  <text x="210" y="660" fill="#d9c9a8" font-size="30">الله لا إله إلا هو الحي القيوم</text>
  <text x="210" y="700" fill="#9aa3c9" font-size="16">سورة البقرة، الآية 255</text>

  <!-- input -->
  <rect x="180" y="780" width="880" height="60" rx="30" fill="#182040" stroke="#3a4warn" stroke-opacity="0"/>
  <rect x="180" y="780" width="880" height="60" rx="30" fill="#182040" stroke="#2c3354" stroke-width="1"/>
  <text x="220" y="817" fill="#8f9ac4" font-size="18">اكتب سؤالك هنا...</text>
  <circle cx="1020" cy="810" r="24" fill="url(#lantern)"/>
  <circle cx="1020" cy="810" r="20" fill="#f2c063"/>
</svg>