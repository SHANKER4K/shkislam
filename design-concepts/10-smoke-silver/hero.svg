<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#E7EBEF"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF0F3"/>
      <stop offset="1" stop-color="#DFE4E9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2F5F8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- page mist -->
  <rect width="1536" height="1024" fill="url(#mist)"/>

  <!-- right sidebar (RTL start side) -->
  <rect x="0" y="0" width="292" height="1024" fill="url(#metal)"/>
  <rect x="292" y="0" width="1" height="1024" fill="#CBD2D8"/>

  <!-- logo -->
  <rect x="38" y="34" width="22" height="22" rx="6" fill="#2563EB"/>
  <text x="72" y="51" font-family="Tajawal, Arial, sans-serif" font-size="17" font-weight="700" fill="#3A434C">SHK</text>

  <!-- new chat button -->
  <rect x="20" y="76" width="252" height="38" rx="9" fill="#2563EB"/>
  <text x="146" y="101" font-family="Tajawal, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ محادثة جديدة</text>

  <!-- nav items -->
  <g font-family="Tajawal, Arial, sans-serif" font-size="14">
    <rect x="12" y="140" width="268" height="38" rx="8" fill="#DCE3FF"/>
    <rect x="12" y="140" width="3" height="38" rx="1.5" fill="#2563EB"/>
    <text x="52" y="165" font-weight="600" fill="#1D4ED8">القرآن الكريم</text>
    <rect x="12" y="186" width="268" height="38" rx="8"/>
    <text x="52" y="211" fill="#5A6570">الأحاديث النبوية</text>
    <rect x="12" y="232" width="268" height="38" rx="8"/>
    <text x="52" y="257" fill="#5A6570">المواضيع</text>
    <rect x="12" y="278" width="268" height="38" rx="8"/>
    <text x="52" y="303" fill="#5A6570">المفضلة</text>
    <rect x="12" y="324" width="268" height="38" rx="8"/>
    <text x="52" y="349" fill="#5A6570">البحث</text>
  </g>

  <!-- collapse seam hint -->
  <rect x="1244" y="20" width="24" height="24" rx="6" fill="#E4E9EE" stroke="#CBD2D8"/>
  <text x="1256" y="37" font-family="Arial" font-size="12" fill="#5A6570" text-anchor="middle">«</text>

  <!-- chat thread header -->
  <text x="1210" y="44" font-family="Tajawal, Arial, sans-serif" font-size="15" font-weight="600" fill="#3A434C" text-anchor="middle">المحادثة</text>
  <rect x="334" y="64" width="1150" height="1" fill="#D5DBE1"/>

  <!-- empty state -->
  <g text-anchor="middle" font-family="Tajawal, Arial, sans-serif">
    <rect x="872" y="150" width="74" height="74" rx="18" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="909" y="196" font-size="30" fill="#2563EB">✦</text>
    <text x="909" y="270" font-size="26" font-weight="800" fill="#3A434C">اسأل عن أي آية أو حديث</text>
    <text x="909" y="302" font-size="14" fill="#6B7681">محادثة مدعومة بالذكاء الاصطناعي مع الاستشهاد من المصادر</text>
  </g>

  <!-- suggestion chips -->
  <g font-family="Tajawal, Arial, sans-serif" font-size="13">
    <rect x="724" y="330" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="794" y="352" fill="#4B5563" text-anchor="middle">آيات عن الصبر</text>
    <rect x="874" y="330" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="949" y="352" fill="#4B5563" text-anchor="middle">أحاديث عن الوالدين</text>
    <rect x="1034" y="330" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="1104" y="352" fill="#4B5563" text-anchor="middle">تفسير سورة الفاتحة</text>
  </g>

  <!-- user message -->
  <g font-family="Tajawal, Arial, sans-serif">
    <rect x="1126" y="420" width="310" height="60" rx="12" fill="#E2E7EC"/>
    <text x="1142" y="446" font-size="14" fill="#3A434C">ما الآيات التي تتحدث عن التوكل؟</text>
    <text x="1142" y="468" font-size="11" fill="#8A939C">قبل قليل</text>
  </g>

  <!-- ayah glass callout -->
  <g font-family="Tajawal, Arial, sans-serif">
    <rect x="356" y="520" width="420" height="180" rx="12" fill="url(#panel)" stroke="#D5DBE1"/>
    <rect x="357" y="521" width="418" height="2" rx="1" fill="#FFFFFF"/>
    <rect x="376" y="544" width="18" height="18" rx="5" fill="#2563EB"/>
    <text x="406" y="558" font-size="12.5" font-weight="600" fill="#1D4ED8">القرآن الكريم - 65:3</text>
    <text x="375" y="600" font-size="22" fill="#37414B">ومن يتوكل على الله فهو حسبه</text>
    <text x="375" y="630" font-size="13" fill="#6B7681">سورة الطلاق، الآية 3 - مع التفسير الميسر</text>
    <rect x="376" y="660" width="60" height="24" rx="6" fill="#E8EDF2"/>
    <text x="406" y="676" font-size="11" fill="#5A6570">مصدر موثوق</text>
  </g>

  <!-- frosted input bar -->
  <g font-family="Tajawal, Arial, sans-serif">
    <rect x="370" y="880" width="800" height="60" rx="12" fill="url(#panel)" stroke="#CBD2D8"/>
    <rect x="371" y="881" width="798" height="2" rx="1" fill="#FFFFFF"/>
    <text x="398" y="916" font-size="14" fill="#8A939C">اسأل عن آية أو حديث...</text>
    <rect x="1122" y="892" width="36" height="36" rx="18" fill="#2563EB"/>
    <text x="1140" y="917" font-size="16" fill="#FFFFFF" text-anchor="middle">⮚</text>
  </g>
</svg>
