<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Tajawal, Arial, sans-serif">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0e6"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/>
      <stop offset="1" stop-color="#ecdfce"/>
    </linearGradient>
    <linearGradient id="sandBed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- desert floor -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#floor)"/>

  <!-- sweeping dune horizon line -->
  <path d="M0 620 C 300 580, 560 650, 900 610 C 1200 575, 1400 640, 1600 600 L1600 900 L0 900 Z" fill="#f0e5d2" opacity="0.5"/>
  <path d="M0 700 C 400 660, 800 740, 1200 690 C 1400 670, 1500 700, 1600 680 L1600 900 L0 900 Z" fill="#e9dcc6" opacity="0.4"/>
  <path d="M0 790 C 500 750, 900 820, 1600 770 L1600 900 L0 900 Z" fill="#e2d3b8" opacity="0.5"/>

  <!-- high sun -->
  <circle cx="1210" cy="120" r="52" fill="none" stroke="#d07b3a" stroke-width="2.5" opacity="0.35"/>
  <circle cx="1210" cy="120" r="38" fill="none" stroke="#d07b3a" stroke-width="2" opacity="0.5"/>

  <!-- ===== Sidebar on the RIGHT (start side in RTL) ===== -->
  <g>
    <rect x="1230" y="0" width="370" height="900" fill="url(#dune)"/>
    <!-- dune crease hairline -->
    <line x1="1230" y1="0" x2="1230" y2="900" stroke="#dfd0ba" stroke-width="1.5"/>

    <!-- logo -->
    <text x="1370" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4a36">SHK إسلام</text>
    <text x="1450" y="92" text-anchor="start" font-size="13" fill="#b26d3a">◉</text>

    <!-- new chat pill -->
    <rect x="1252" y="118" width="326" height="44" rx="22" fill="#e7dac6"/>
    <text x="1276" y="146" font-size="17" fill="#5c4a36">+ محادثة جديدة</text>

    <!-- nav items -->
    <g font-size="17" fill="#6d5a44">
      <rect x="1252" y="180" width="326" height="40" rx="14" fill="#eadcc8"/>
      <circle cx="1300" cy="200" r="7" fill="#d07b3a"/>
      <text x="1320" y="206">القرآن الكريم</text>

      <rect x="1252" y="230" width="326" height="40" rx="14" fill="transparent"/>
      <circle cx="1300" cy="250" r="6" fill="#c9b globalization" fill-opacity="0"/>
      <text x="1320" y="256" opacity="0.75">الأحاديث النبوية</text>

      <rect x="1252" y="280" width="326" height="40" rx="14" fill="transparent"/>
      <text x="1320" y="306" opacity="0.75">المواضيع</text>

      <rect x="1252" y="330" width="326" height="40" rx="14" fill="transparent"/>
      <text x="1320" y="356" opacity="0.75">المفضلة</text>

      <rect x="1252" y="380" width="326" height="40" rx="14" fill="transparent"/>
      <text x="1320" y="406" opacity="0.75">البحث</text>
    </g>

    <!-- theme toggle -->
    <circle cx="1300" cy="852" r="16" fill="#eadcc8"/>
    <text x="1300" y="858" text-anchor="middle" font-size="16" fill="#b26d3a">☾</text>
  </g>

  <!-- ===== Chat thread (open floor, right of line) ===== -->
  <g>
    <!-- user chip -->
    <rect x="250" y="120" width="auto" height="0"/>
    <g>
      <rect x="40" y="130" width="380" height="0" fill="none"/>
    </g>

    <!-- suggested prompt chips -->
    <text x="80" y="210" font-size="15" fill="#8a7458">بماذا يمكنني مساعدتك؟</text>
    <g font-size="16" fill="#6d5a44">
      <rect x="80" y="240" width="300" height="46" rx="23" fill="#fdfbf7" stroke="#e3d6c0" stroke-width="1.5"/>
      <text x="230" y="269" text-anchor="middle">آية عن الصبر</text>
      <rect x="420" y="240" width="300" height="46" rx="23" fill="#fdfbf7" stroke="#e3d6c0" stroke-width="1.5"/>
      <text x="570" y="269" text-anchor="middle">أحاديث عن الوالدين</text>
      <rect x="760" y="240" width="300" height="46" rx="23" fill="#fdfbf7" stroke="#e3d6c0" stroke-width="1.5"/>
      <text x="910" y="269" text-anchor="middle">تفسير سورة الفاتحة</text>
    </g>

    <!-- user message chip -->
    <rect x="790" y="340" width="360" height="54" rx="22" fill="#e9dcc6"/>
    <text x="820" y="372" font-size="18" fill="#5c4a36">ما تفسير آية الصبر؟</text>

    <!-- assistant plain flow text -->
    <text x="80" y="460" font-size="18" fill="#4d3d2c">قال تعالى في محكم التنزيل:</text>

    <!-- ayah callout (pourd-sand inset with ember right rule) -->
    <g>
      <rect x="80" y="500" width="1080" height="180" rx="24" fill="#fdfbf7" stroke="#e3d6c0" stroke-width="1.5"/>
      <!-- ember rule on start (right) edge -->
      <rect x="1136" y="508" width="6" height="164" rx="3" fill="#d07b3a"/>
      <text x="360" y="560" font-size="26" font-family="serif" fill="#2c2320">﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾</text>
      <text x="360" y="620" font-size="16" fill="#8a7458">القرآن الكريم · سورة البقرة</text>
      <text x="360" y="652" font-size="15" fill="#6d5a44">سورة البقرة - الآية 153</text>
    </g>
  </g>

  <!-- ===== Docked composer sand bed ===== -->
  <rect x="80" y="800" width="1080" height="64" rx="32" fill="url(#sandBed)" stroke="#e0d2ba" stroke-width="1.5"/>
  <circle cx="1110" cy="832" r="24" fill="#d07b3a"/>
  <path d="M1098 832 L1122 832 M1110 820 L1110 844 M1122 826 L1110 838 L1098 826" stroke="#fdfbf7" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="120" y="843" font-size="19" fill="#a99478">اكتب سؤالك هنا...</text>

  <!-- caption -->
  <text x="80" y="880" font-size="13" fill="#c2b298">Desert Dune - chat-first SHK Islam (RTL)</text>
</svg>