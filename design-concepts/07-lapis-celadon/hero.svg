<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="'Tajawal','Segoe UI',sans-serif" dir="rtl">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe7fb"/>
      <stop offset="1" stop-color="#c7d8f6"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27418c"/>
      <stop offset="1" stop-color="#1a2c68"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c26a"/>
      <stop offset="1" stop-color="#c99a3e"/>
    </linearGradient>
    <pattern id="gear" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M23 0 L27 20 L46 23 L27 26 L23 46 L19 26 L0 23 L19 20 Z" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <!-- page ground -->
  <rect width="1536" height="1024" fill="url(#sky)"/>

  <!-- deep lapis dome sidebar (RTL: right side visually) -->
  <rect x="1200" y="0" width="336" height="1024" fill="url(#dome)"/>
  <rect x="1200" y="0" width="336" height="1024" fill="url(#gear)"/>
  <rect x="1200" y="0" width="2" height="1024" fill="#5a74c4"/>

  <!-- gold crown / logo -->
  <line x1="1216" y1="86" x2="1520" y2="86" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="1232" cy="50" r="6" fill="url(#gold)"/>
  <text x="1250" y="57" font-size="22" fill="#eef3ff" font-weight="700">SHK Islam</text>

  <!-- new chat plate -->
  <rect x="1216" y="108" width="304" height="44" rx="6" fill="rgba(255,255,255,0.06)" stroke="#e7c26a" stroke-opacity="0.45" stroke-width="1"/>
  <text x="1410" y="136" text-anchor="middle" font-size="16" fill="#f0d186">＋ المحادثة جديدة</text>

  <!-- nav items -->
  <g font-size="15">
    <rect x="1216" y="170" width="304" height="40" rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="1504" y="170" width="3" height="40" fill="url(#gold)"/>
    <line x1="1232" y1="190" x2="1240" y2="190" stroke="url(#gold)" stroke-width="1.6"/>
    <text x="1256" y="196" fill="#f4c976">القرآن الكريم</text>

    <line x1="1232" y1="226" x2="1237" y2="226" stroke="#8fa6dd" stroke-width="1.4"/>
    <text x="1256" y="232" fill="#cfe0f6">الأحاديث النبوية</text>

    <line x1="1232" y1="266" x2="1237" y2="266" stroke="#8fa6dd" stroke-width="1.4"/>
    <text x="1256" y="272" fill="#cfe0f6">المواضيع</text>

    <line x1="1232" y1="306" x2="1237" y2="306" stroke="#8fa6dd" stroke-width="1.4"/>
    <text x="1256" y="312" fill="#cfe0f6">المفضلة</text>

    <line x1="1232" y1="346" x2="1237" y2="346" stroke="#8fa6dd" stroke-width="1.4"/>
    <text x="1256" y="352" fill="#cfe0f6">البحث</text>

    <line x1="1232" y1="386" x2="1237" y2="386" stroke="#8fa6dd" stroke-width="1.4"/>
    <text x="1256" y="392" fill="#cfe0f6">حول المنصة</text>
  </g>

  <!-- sidebar footer: theme + avatar -->
  <line x1="1216" y1="958" x2="1520" y2="958" stroke="#43609f" stroke-width="1"/>
  <circle cx="1232" cy="982" r="14" fill="rgba(255,255,255,0.10)" stroke="#8fa6dd" stroke-width="1"/>
  <text x="1260" y="988" font-size="14" fill="#cfe0f6">الوضع الليلي</text>
  <circle cx="1498" cy="982" r="16" fill="#8fa6dd"/>

  <!-- chat column -->
  <!-- assistant message -->
  <g>
    <rect x="440" y="96" width="640" height="120" rx="6" fill="none"/>
    <text x="460" y="140" font-size="26" fill="#2a4a95" font-weight="700">السلام عليكم</text>
    <text x="460" y="176" font-size="17" fill="#3d5aa8">هذا محرّك بحث إسلامي يجيب عن أسئلتك من القرآن</text>
    <text x="460" y="200" font-size="17" fill="#3d5aa8">والأحاديث النبوية الصحيحة. اسألني عن أي موضوع.</text>
  </g>

  <!-- user message (celadon inset) -->
  <g>
    <rect x="300" y="248" width="780" height="66" rx="6" fill="#bcd6c0"/>
    <text x="320" y="288" font-size="19" fill="#234a2f">ما هي الآيات والأحاديث عن بر الوالدين؟</text>
  </g>

  <!-- assistant reply -->
  <g>
    <text x="440" y="372" font-size="19" fill="#3d3a8f" font-weight="500">القرآن الكريم - سورة الإسراء</text>
    <!-- gold-ruled citation tile -->
    <rect x="440" y="392" width="700" height="128" rx="6" fill="#c8ddca"/>
    <rect x="440" y="392" width="4" height="128" fill="url(#gold)"/>
    <rect x="440" y="392" width="700" height="1.5" fill="url(#gold)"/>
    <rect x="452" y="400" width="10" height="10" fill="url(#gold)" transform="rotate(45 457 405)"/>
    <text x="480" y="452" font-size="22" fill="#1a3a6b" font-style="italic">وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا</text>
    <text x="480" y="498" font-size="14" fill="#5a7a8f">سورة الإسراء، الآية 23 - التفسير الميسر</text>
  </g>

  <!-- second assistant plain line -->
  <text x="440" y="566" font-size="17" fill="#3d5aa8">وهذه أحاديث شريفة عن فضل بر الوالدين:</text>

  <!-- hadith citation tile -->
  <g>
    <rect x="440" y="600" width="700" height="120" rx="6" fill="#c8ddca"/>
    <rect x="440" y="600" width="4" height="120" fill="url(#gold)"/>
    <rect x="440" y="600" width="700" height="1.5" fill="url(#gold)"/>
    <rect x="452" y="608" width="10" height="10" fill="url(#gold)" transform="rotate(45 457 613)"/>
    <text x="480" y="660" font-size="21" fill="#1a3a6b">الوالد أوسطُ أبوابِ الجنّة، فإن شئت فأضِع ذلك الباب أو احفظه</text>
    <text x="480" y="700" font-size="14" fill="#5a7a8f">رواه الترمذي - صحيح</text>
  </g>

  <!-- gold-ruled empty hint pill -->
  <text x="440" y="762" font-size="17" fill="#3d5aa8">اسألني عن الصبر، الرزق، صلاة الجماعة، أو غيره...</text>

  <!-- input dock (celadon) -->
  <g>
    <rect x="360" y="900" width="780" height="64" rx="8" fill="#eef2f7" stroke="#a9c1e8" stroke-width="1.2"/>
    <text x="390" y="938" font-size="17" fill="#7c90b8">اكتب سؤالك هنا...</text>
    <circle cx="1108" cy="932" r="20" fill="url(#gold)"/>
    <path d="M1112 921 l-2 2 M1112 921 v20 M1112 921 l-9 9 M1112 941 l9 -9"
          stroke="#e8eefc" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 1112 932)"/>
  </g>

  <!-- gold diamond ornament top-right of chat (weak echo of motif) -->
  <rect x="88" y="80" width="14" height="14" fill="url(#gold)" opacity="0.5" transform="rotate(45 95 87)"/>
  <line x1="88" y1="120" x2="105" y2="120" stroke="#b9c9e8" stroke-width="1"/>

  <!-- celadon sidebar-active echo behind center -->
</svg>