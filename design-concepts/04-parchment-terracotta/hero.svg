<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Parchment Terracotta chat hero mockup">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feComponentTransfer in="noise">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background parchment -->
  <rect width="1600" height="900" fill="#F4EDDD" filter="url(#grain)"/>

  <!-- Sidebar (right side in RTL) -->
  <rect x="1180" y="0" width="420" height="900" fill="#FBF6EA"/>
  <line x1="1180" y1="0" x2="1180" y2="900" stroke="#E0D3BC" stroke-width="1.5"/>

  <!-- Sidebar brand -->
  <text x="1360" y="70" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="30" font-weight="700" fill="#4A3B2E">✦ SHK Islam</text>
  <line x1="1200" y1="110" x2="1580" y2="110" stroke="#E0D3BC" stroke-width="1.5"/>

  <!-- New chat button -->
  <rect x="1200" y="135" width="380" height="50" rx="25" fill="#B4552D"/>
  <text x="1390" y="167" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="20" font-weight="500" fill="#FBF6EA">+ محادثة جديدة</text>

  <!-- Nav items -->
  <g font-family="Tajawal, sans-serif" font-size="21" fill="#5C4633">
    <text x="1235" y="255">▸ القرآن الكريم</text>
    <text x="1235" y="305" fill="#B4552D" font-weight="700">▸ الأحاديث النبوية</text>
    <text x="1235" y="355">▸ المواضيع</text>
    <text x="1235" y="405">▸ المفضلة</text>
    <text x="1235" y="455">▸ البحث</text>
    <text x="1235" y="505">▸ حول المنصة</text>
  </g>
  <rect x="1186" y="280" width="3" height="30" fill="#B4552D" rx="1.5"/>
  <line x1="1200" y1="540" x2="1580" y2="540" stroke="#E0D3BC" stroke-width="1.5"/>
  <text x="1235" y="580" font-family="Tajawal, sans-serif" font-size="20" fill="#8A735C">🌙 الوضع الليلي</text>

  <!-- Chat column -->
  <!-- Empty state headline -->
  <text x="520" y="200" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="44" font-weight="800" fill="#4A3B2E">بماذا تريد أن تبدأ؟</text>
  <text x="520" y="245" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="22" fill="#8A735C">اكتب سؤالك، وسأجيبك من القرآن والسنة</text>

  <!-- Suggestion chips -->
  <g font-family="Tajawal, sans-serif" font-size="20" fill="#5C4633" text-anchor="middle">
    <rect x="300" y="290" width="280" height="52" rx="26" fill="#F7EFDF" stroke="#E0D3BC"/>
    <text x="440" y="323">آيات عن الصبر</text>
    <rect x="610" y="290" width="300" height="52" rx="26" fill="#F7EFDF" stroke="#E0D3BC"/>
    <text x="760" y="323">أحاديث عن الوالدين</text>
    <rect x="940" y="290" width="280" height="52" rx="26" fill="#F7EFDF" stroke="#E0D3BC"/>
    <text x="1080" y="323">تفسير سورة الفاتحة</text>
  </g>

  <!-- Example inked ayah callout -->
  <rect x="260" y="420" width="620" height="150" rx="12" fill="#FBF6EA" stroke="#E0D3BC"/>
  <rect x="260" y="420" width="3" height="150" fill="#B4552D"/>
  <circle cx="271" cy="428" r="3.5" fill="#B4552D"/>
  <text x="300" y="462" font-family="Uthmanic, serif" font-size="26" fill="#3A2E22">إِنَّ مَعَ الْعُسْرِ يُسْرًا</text>
  <text x="300" y="502" font-family="Tajawal, sans-serif" font-size="16" fill="#8A735C">سورة الشرح 94:6 · tabular</text>

  <!-- Example assistant message -->
  <text x="300" y="600" font-family="Tajawal, sans-serif" font-size="20" fill="#4A3B2E">بينما عَسرة الضيق، فمعه عزاءٌ ورحمة</text>
  <text x="300" y="632" font-family="Tajawal, sans-serif" font-size="20" fill="#4A3B2E">من الله في عاجل الأمر وآجله</text>

  <!-- Docked parchment input well -->
  <rect x="180" y="720" width="760" height="64" rx="16" fill="#FBF6EA" stroke="#E0D3BC"/>
  <ellipse cx="880" cy="752" rx="26" ry="26" fill="#B4552D"/>
  <path d="M906 752 L904 748 M910 752 L906 756" stroke="#FBF6EA" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="762" font-family="Tajawal, sans-serif" font-size="20" fill="#A08A6E">اكتب سؤالك هنا...</text>

  <text x="800" y="880" font-family="Tajawal, sans-serif" font-size="16" fill="#A08A6E">SHK Islam · مكتبة العالم الرقمية</text>
</svg>