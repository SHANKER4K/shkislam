<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="0.5" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#1a1a1a"/>

  <!-- sidebar panel -->
  <rect x="0" y="0" width="300" height="900" fill="#212121"/>
  <line x1="300" y1="0" x2="300" y2="900" stroke="#383838" stroke-width="1"/>

  <!-- logo row -->
  <rect x="24" y="20" width="14" height="14" fill="none" stroke="#d8d8d8" stroke-width="1.5"/>
  <text x="48" y="32" fill="#ececec" font-size="13" letter-spacing="2">SHK / INSTR</text>

  <!-- new chat -->
  <rect x="16" y="56" width="268" height="36" fill="none" stroke="#383838" stroke-width="1"/>
  <text x="32" y="79" fill="#d8d8d8" font-size="14">+ NEW CHAT</text>
  <text x="252" y="79" fill="#8a8a8a" font-size="11" text-anchor="end">CTRL K</text>

  <!-- section label -->
  <text x="24" y="126" fill="#8a8a8a" font-size="10" letter-spacing="3">LIBRARY</text>

  <!-- nav items -->
  <rect x="16" y="138" width="268" height="34" fill="none"/>
  <text x="32" y="160" fill="#8a8a8a" font-size="13">Quran</text>
  <rect x="16" y="176" width="268" height="34" fill="#2a2a2a"/>
  <line x1="16" y1="176" x2="18" y2="210" stroke="#d8d8d8" stroke-width="2"/>
  <text x="32" y="198" fill="#f0f0f0" font-size="13" font-weight="600">Hadith</text>
  <text x="252" y="198" fill="#8a8a8a" font-size="10" text-anchor="end">7.5K</text>
  <rect x="16" y="214" width="268" height="34" fill="none"/>
  <text x="32" y="236" fill="#8a8a8a" font-size="13">Themes</text>
  <rect x="16" y="252" width="268" height="34" fill="none"/>
  <text x="32" y="274" fill="#8a8a8a" font-size="13">Favorites</text>

  <!-- section label -->
  <text x="24" y="322" fill="#8a8a8a" font-size="10" letter-spacing="3">TOOLS</text>
  <rect x="16" y="334" width="268" height="34" fill="none"/>
  <text x="32" y="356" fill="#8a8a8a" font-size="13">Search</text>
  <rect x="16" y="372" width="268" height="34" fill="none"/>
  <text x="32" y="394" fill="#8a8a8a" font-size="13">About</text>

  <!-- sidebar footer -->
  <line x1="16" y1="430" x2="284" y2="430" stroke="#383838" stroke-width="1"/>
  <rect x="16" y="848" width="268" height="36" fill="none"/>
  <text x="32" y="871" fill="#8a8a8a" font-size="11" letter-spacing="2">MODE: DARK</text>
  <text x="252" y="871" fill="#8a8a8a" font-size="11" text-anchor="end">v0.9</text>

  <!-- top bar -->
  <line x1="300" y1="48" x2="1600" y2="48" stroke="#383838" stroke-width="1"/>
  <circle cx="324" cy="24" r="3" fill="#d8d8d8"/>
  <text x="336" y="28" fill="#8a8a8a" font-size="11" letter-spacing="2">SESSION: INSTR-01</text>
  <text x="1576" y="28" fill="#8a8a8a" font-size="11" text-anchor="end">O = SYSTEM / D = DARK</text>

  <!-- empty state mark -->
  <text x="820" y="240" fill="#3d3d3d" font-size="120" text-anchor="middle" font-family="'KFGQPC Uthmanic HAFS', serif">بِسْمِ اللَّهِ</text>
  <text x="820" y="290" fill="#8a8a8a" font-size="13" text-anchor="middle">SELECT A PROMPT OR TYPE BELOW</text>

  <!-- prompt grid -->
  <rect x="470" y="320" width="340" height="96" fill="none" stroke="#383838" stroke-width="1"/>
  <text x="488" y="344" fill="#8a8a8a" font-size="10" letter-spacing="2">01</text>
  <text x="488" y="380" fill="#ececec" font-size="16" font-family="Tajawal, sans-serif">آيات عن الصبر</text>
  <text x="488" y="400" fill="#8a8a8a" font-size="11">Quran search</text>

  <rect x="830" y="320" width="340" height="96" fill="none" stroke="#383838" stroke-width="1"/>
  <text x="848" y="344" fill="#8a8a8a" font-size="10" letter-spacing="2">02</text>
  <text x="848" y="380" fill="#ececec" font-size="16" font-family="Tajawal, sans-serif">أحاديث عن الوالدين</text>
  <text x="848" y="400" fill="#8a8a8a" font-size="11">Hadith search</text>

  <rect x="470" y="432" width="340" height="96" fill="none" stroke="#383838" stroke-width="1"/>
  <text x="488" y="456" fill="#8a8a8a" font-size="10" letter-spacing="2">03</text>
  <text x="488" y="492" fill="#ececec" font-size="16" font-family="Tajawal, sans-serif">تفسير آية الكرسي</text>
  <text x="488" y="512" fill="#8a8a8a" font-size="11">Tafsir</text>

  <rect x="830" y="432" width="340" height="96" fill="none" stroke="#383838" stroke-width="1"/>
  <text x="848" y="456" fill="#8a8a8a" font-size="10" letter-spacing="2">04</text>
  <text x="848" y="492" fill="#ececec" font-size="16" font-family="Tajawal, sans-serif">أسماء الله الحسنى</text>
  <text x="848" y="512" fill="#8a8a8a" font-size="11">Aqeedah</text>

  <!-- input dock -->
  <rect x="470" y="700" width="700" height="96" fill="#212121" stroke="#383838" stroke-width="1"/>
  <line x1="470" y1="700" x2="1170" y2="700" stroke="#d8d8d8" stroke-width="1.5"/>
  <text x="488" y="740" fill="#8a8a8a" font-size="14" font-family="Tajawal, sans-serif">اكتب سؤالك هنا...</text>
  <rect x="1126" y="720" width="28" height="28" fill="#d8d8d8"/>
  <text x="1140" y="739" fill="#1a1a1a" font-size="14" text-anchor="middle">↑</text>

  <!-- status strip -->
  <text x="488" y="822" fill="#8a8a8a" font-size="10" letter-spacing="1">ENTER = SEND · SHIFT+ENTER = NEWLINE</text>
  <text x="1170" y="822" fill="#8a8a8a" font-size="10" text-anchor="end">CHAR 0 · TOK 0</text>
</svg>
